<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝，520快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            /* 粉色渐变背景 */
            background: linear-gradient(180deg, #ffc2d1 0%, #ff8fab 100%);
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 顶部小提示 */
        .tip-top {
            position: fixed;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.25);
            padding: 6px 18px;
            border-radius: 20px;
            z-index: 10;
            white-space: nowrap;
        }

        /* 主标题 */
        .main-title {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 4px 18px rgba(214, 51, 108, 0.5);
            z-index: 10;
            text-align: center;
            line-height: 1.3;
            /* 呼吸动画 */
            animation: breathe 3.5s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.06); }
        }

        /* 底部按钮提示 */
        .tip-bottom {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #d6336c;
            background: #fff;
            padding: 14px 40px;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(214, 51, 108, 0.25);
            z-index: 10;
            white-space: nowrap;
            animation: bounce 2.2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* 爱心样式 */
        .heart {
            position: fixed;
            bottom: -60px;
            color: #ff5c8a;
            font-size: 22px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 1;
            /* 上浮动画 */
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-115vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 图片弹窗 */
        .img-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .img-modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
            animation: zoomIn 0.4s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.3rem;
            }
            .tip-bottom {
                font-size: 1rem;
                padding: 12px 32px;
            }
            .tip-top {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="tip-top">💖 点一下，收下我的心意</div>
    <div class="main-title">宝宝，520<br>快乐</div>
    <div class="tip-bottom">点我弹出照片 💖</div>

    <!-- 图片弹窗容器 -->
    <div class="img-modal" id="photoModal">
        <img id="showPhoto" src="" alt="我们的照片">
    </div>

    <script>
        // ========== 1. 爱心飘动效果 ==========
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤';

            // 随机水平位置
            heart.style.left = Math.random() * 100 + 'vw';
            // 随机大小
            const size = Math.random() * 22 + 16;
            heart.style.fontSize = size + 'px';
            // 随机飘动速度
            const duration = Math.random() * 5 + 6;
            heart.style.animationDuration = duration + 's';
            // 随机深浅颜色
            const colors = ['#ff5c8a', '#ff8fab', '#ffb3c6', '#ff758f'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            // 随机透明度
            heart.style.opacity = Math.random() * 0.4 + 0.4;

            document.body.appendChild(heart);

            // 动画结束后自动删除，避免占用内存
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // 每300毫秒生成一个爱心，持续飘动
        setInterval(createHeart, 300);


        // ========== 2. 点击弹出照片逻辑 ==========
        const modal = document.getElementById('photoModal');
        const photo = document.getElementById('showPhoto');
        let currentIndex = 0;
        // 一共6张照片，文件名对应 1.jpg ~ 6.jpg
        const totalPhotos = 6;

        // 点击页面任意位置切换照片
        document.body.addEventListener('click', function () {
            currentIndex++;

            // 看完6张后关闭弹窗，重新点击再从头开始
            if (currentIndex > totalPhotos) {
                currentIndex = 0;
                modal.style.display = 'none';
                return;
            }

            // 设置图片路径并显示弹窗
            photo.src = currentIndex + '.jpg';
            modal.style.display = 'flex';
        });
    </script>
</body>
</html>
